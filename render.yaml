services:
  # GeNotify Combined Service (API + Discord Bot)
  - type: web
    name: genotify
    runtime: node
    region: frankfurt
    plan: free  # Free tier with limitations
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render free tier uses port 10000
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (Neon PostgreSQL)
      - key: API_KEY
        sync: false  # Set manually in Render dashboard
      - key: DISCORD_BOT_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: DISCORD_GUILD_ID
        sync: false  # Set manually in Render dashboard
    autoDeploy: true

